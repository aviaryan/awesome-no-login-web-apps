name: Apply TextBases listing patch

on:
  push:
    branches:
      - add-textbases

permissions:
  contents: write

jobs:
  patch-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-textbases
      - name: Add TextBases to text tools
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          entry = '* [TextBases](https://textbases.app/) - Free browser-based text and developer tools for counting, cleaning, formatting, encoding, decoding, and generating text without creating an account.'
          needle = '* [Emojify](https://madelinemiller.dev/apps/emojify/) - A tool to spice up text, lyrics, or poems by adding emojis.'

          if entry not in text:
              if needle not in text:
                  raise SystemExit('Expected insertion point was not found.')
              text = text.replace(needle, needle + '\n' + entry, 1)
              path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/apply-textbases.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/apply-textbases.yml
          git commit -m "Add TextBases to text tools"
          git push origin HEAD:add-textbases
