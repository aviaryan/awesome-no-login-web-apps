name: Canonicalize Need Go Home URL once

on:
  push:
    branches: [add-need-go-home]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-need-go-home
      - name: Replace legacy Need Go Home URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          old = 'https://needgohome.netlify.app/'
          new = 'https://needgohome.com/'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy Need Go Home URL, found {count}')
          p.write_text(text.replace(old, new))
          PY
      - name: Commit URL update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: use Need Go Home canonical URL"
          git push origin HEAD:add-need-go-home
